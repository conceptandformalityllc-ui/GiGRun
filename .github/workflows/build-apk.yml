name: Build APK

# Builds an installable debug APK every time you push, or on demand from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GigRun
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: GigRun

      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: GigRun-debug-apk
          path: GigRun/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
