<link rel="stylesheet" href="css/app.css">
</head>
<body>

    <symbol id="i-car" viewBox="0 0 24 24"><path d="M4 17v-4l2-5h12l2 5v4M3 17h18M7 17v2.5M17 17v2.5"/><circle cx="8" cy="13.5" r="1"/><circle cx="16" cy="13.5" r="1"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></symbol>
    <symbol id="i-haul" viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-handy" viewBox="0 0 24 24"><path d="M13 5l6 6-2.5 2.5-6-6z"/><path d="M11.5 9L4 16.5 7.5 20 15 12.5"/></symbol>

    <symbol id="i-t-map" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-t-mine" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l3 3 5-6"/></symbol>
    <symbol id="i-t-people" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c.5-3.5 2.7-5.2 5.5-5.2s5 1.7 5.5 5.2"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16.5 14.4c2.4.1 3.7 1.6 4 4.3"/></symbol>
    <symbol id="i-t-you" viewBox="0 0 24 24"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>

    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>

<div id="app">
  <header id="top">
    <div class="logo"><span class="mark"></span><span>GigRun</span></div>
    <button id="locChip" class="loc" type="button" aria-label="Update my location"><i></i><span>Locating</span></button>
  </header>

  <main id="screens">
    <section id="scr-jobs" class="screen active" aria-label="Open jobs"></section>
    <section id="scr-map" class="screen" aria-label="Map">
      <div id="mapRoot"></div>
      <div class="map-top" id="mapTop"></div>
      <div class="map-side" id="mapSide"></div>
      <div class="map-card" id="mapCard"></div>
    </section>
    <section id="scr-mine" class="screen" aria-label="My jobs"></section>
    <section id="scr-people" class="screen" aria-label="Customers"></section>
    <section id="scr-you" class="screen" aria-label="Settings"></section>
  </main>

  <nav id="tabs" aria-label="Main">
    <button data-tab="jobs" class="active" type="button"><svg class="ic"><use href="#i-t-jobs"/></svg><span>Jobs</span><b class="badge" hidden></b></button>
    <button data-tab="map" type="button"><svg class="ic"><use href="#i-t-map"/></svg><span>Map</span></button>
    <button data-tab="mine" type="button"><svg class="ic"><use href="#i-t-mine"/></svg><span>My jobs</span><b class="badge" hidden></b></button>
    <button data-tab="people" type="button"><svg class="ic"><use href="#i-t-people"/></svg><span>People</span><b class="badge" hidden></b></button>
    <button data-tab="you" type="button"><svg class="ic"><use href="#i-t-you"/></svg><span>You</span></button>
  </nav>

  <div id="sheetHost"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
<script src="js/sheets.js"></script>
<script src="js/review.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
